# Publish the PC companion: tag `companion-vX.Y.Z` and the Windows and Linux
# builds land on a GitHub release under fixed names. solenix.dev/eh finds the
# newest `companion-v*` release and serves the file for the visitor's PC.
name: Companion release
on:
  push:
    tags: ["companion-v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            built: companion/target/release/event-horizon-companion.exe
            asset: EventHorizonCompanion-Windows.exe
          - os: ubuntu-22.04
            built: companion/target/release/event-horizon-companion
            asset: event-horizon-companion-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        working-directory: companion
        run: cargo build --release
      - name: Name the asset
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum EventHorizonCompanion-Windows.exe event-horizon-companion-linux-x86_64 > SHA256SUMS
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --title "PC companion ${{ github.ref_name }}" --latest=false \
            --notes "Run it on your gaming PC: it installs Sunshine and pairs with Event Horizon on your Mac with one click on Allow." \
            EventHorizonCompanion-Windows.exe event-horizon-companion-linux-x86_64 SHA256SUMS
