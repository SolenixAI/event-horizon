name: macOS app release

on:
  push:
    tags:
      - "20*.*.*"

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'SolenixAI/event-horizon'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm version tag points to main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^20[0-9]{2}\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid app version tag: $TAG" >&2; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          committed_version="$(git show "$GITHUB_SHA:Glimmer/Version.xcconfig" | sed -n 's/^MARKETING_VERSION = \(.*\)/\1/p' | tr -d ' ')"
          [[ "$committed_version" == "$TAG" ]] || { echo "Tag $TAG does not match source version $committed_version" >&2; exit 1; }
      - name: Install the Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Prepare protected signing credentials
        env:
          DEVELOPER_ID_NAME: ${{ secrets.DEVELOPER_ID_NAME }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/prepare-ci-signing.sh
      - name: Build, sign, notarize, validate, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES_REPO: SolenixAI/event-horizon
        run: make release-publish
