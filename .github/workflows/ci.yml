# Build and run every test on each push and pull request. Standard GitHub-hosted
# runners are free for public repositories; xcode-27 is the macOS 27 image with
# Xcode 27 (the app uses macOS 27 APIs behind availability checks).
name: CI
on:
  push:
    branches: [event-horizon]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Every job only reads the code; no job needs write access.
permissions:
  contents: read
jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build and test
        run: make test
  lint:
    # The strict gate `make verify` runs first, on every PR. It needs no build, so it
    # reports in about a minute. The hosted macOS image does not ship SwiftLint, so Homebrew installs it.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Strict SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict
  skills:
    # Every agent skill stays model-invocable: the unlock script must find
    # nothing to change in a commit.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: No locked skills
        run: scripts/unlock-skills.sh && git diff --exit-code .agents .claude
  companion:
    # The PC companion: its core and both OS adapters, on the PCs it runs on.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
  companion-install-windows:
    # End to end on a fresh Windows PC: one command installs Sunshine and the
    # companion, then the companion answers and its Sunshine login works.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: companion
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --release
      - name: Install (as a person would, by running the companion's installer)
        run: |
          # WaitForExit waits for the installer only, not the companion it starts.
          $p = Start-Process ./target/release/event-horizon-companion.exe -ArgumentList install -PassThru -RedirectStandardError install-err.txt
          $p.WaitForExit()
          Get-Content install-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "install ended with $($p.ExitCode)" }
      - name: Sunshine is installed and running
        run: |
          Get-Service SunshineService | Format-List Name, Status, StartType
          if ((Get-Service SunshineService).Status -ne 'Running') { throw 'SunshineService is not running' }
      - name: The companion answers on the network
        run: |
          Start-Sleep -Seconds 5
          # The Link is HTTPS with the companion's own certificate; the Rust tests pin it.
          $hello = Invoke-RestMethod -SkipCertificateCheck https://127.0.0.1:47970/hello
          if ($hello.app -ne 'event-horizon-companion') { throw "unexpected hello: $hello" }
      - name: The companion's Sunshine login works
        run: |
          # Sunshine probes encoders at start; give its web API up to 90 s.
          $up = $false
          foreach ($i in 1..45) {
            if ((Test-NetConnection 127.0.0.1 -Port 47990 -WarningAction SilentlyContinue).TcpTestSucceeded) { $up = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $up) {
            Get-Process sunshine* -ErrorAction SilentlyContinue | Format-Table Name, Id, SessionId
            Get-Content "$env:ProgramFiles\Sunshine\config\sunshine.log" -Tail 40 -ErrorAction SilentlyContinue
            throw 'Sunshine web API never listened on 47990'
          }
          $env = Get-Content "$env:APPDATA\event-horizon\companion.env" | ConvertFrom-StringData
          $user = $env.SUNSHINE_USER.Trim('"'); $pass = $env.SUNSHINE_PASSWORD.Trim('"')
          $pair = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("${user}:${pass}"))
          $apps = Invoke-RestMethod -SkipCertificateCheck -Headers @{ Authorization = "Basic $pair" } https://127.0.0.1:47990/api/apps
          $apps.apps | Select-Object name
      - name: It starts at login
        run: |
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          if (-not $run.'Event Horizon') { throw 'no Run entry' }
  ci-summary:
    # The one check the branch ruleset requires. It passes only when every job above
    # passed, so adding or renaming a job never leaves the ruleset stale.
    if: always()
    needs: [test, lint, skills, companion, companion-install-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
