# Build and run every test on each push and pull request. Standard GitHub-hosted
# runners are free for public repositories; xcode-27 is the macOS 27 image with
# Xcode 27 (the app uses macOS 27 APIs behind availability checks).
name: CI
on:
  push:
    branches: [event-horizon]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: make test
