[package]
name = "event-horizon-companion"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Turns a gaming PC into an Event Horizon host"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mdns-sd = "0.21.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "test-util"] }

# TLS for Sunshine's local API: the OS's own on Windows and macOS (dev),
# pure Rust on Linux, so the companion needs no system OpenSSL.
# The Link's own TLS (self-signed, pinned by the Mac): rustls on the same
# crypto provider as the client above, so one provider is linked on each OS.
[target.'cfg(not(target_os = "linux"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "linux")'.dependencies.rustls]
version = "0.23"
default-features = false
features = ["std", "tls12", "aws_lc_rs"]

[target.'cfg(target_os = "linux")'.dependencies.rcgen]
version = "0.14"
default-features = false
features = ["aws_lc_rs"]

[target.'cfg(not(target_os = "linux"))'.dependencies.rustls]
version = "0.23"
default-features = false
features = ["std", "tls12", "ring"]

[target.'cfg(not(target_os = "linux"))'.dependencies.rcgen]
version = "0.14"
default-features = false
features = ["ring"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
